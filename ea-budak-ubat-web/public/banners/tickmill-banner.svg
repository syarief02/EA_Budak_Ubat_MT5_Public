<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 70" width="300" height="70">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </linearGradient>
    <linearGradient id="acc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background card with border -->
  <rect x="1" y="1" width="298" height="68" rx="8" fill="url(#bg)" stroke="#e11d48" stroke-width="1.2" stroke-opacity="0.4"/>
  
  <!-- Subtle tech grid pattern lines -->
  <line x1="20" y1="1" x2="20" y2="69" stroke="#e11d48" stroke-width="0.5" stroke-opacity="0.15" />
  <line x1="80" y1="1" x2="80" y2="69" stroke="#e11d48" stroke-width="0.5" stroke-opacity="0.15" />
  <line x1="220" y1="1" x2="220" y2="69" stroke="#e11d48" stroke-width="0.5" stroke-opacity="0.15" />

  <!-- Left Broker Pill -->
  <g transform="translate(12, 12)">
    <rect x="0" y="0" width="60" height="46" rx="6" fill="#000" fill-opacity="0.45" stroke="#e11d48" stroke-width="1" stroke-opacity="0.3"/>
    <text x="30" y="24" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="900" text-anchor="middle" letter-spacing="0.5">TICKMILL</text>
    <rect x="8" y="32" width="44" height="1.5" fill="url(#acc)"/>
  </g>

  <!-- Middle Content -->
  <g transform="translate(82, 14)">
    <!-- Badge -->
    <rect x="0" y="0" width="90" height="13" rx="3" fill="#e11d48" fill-opacity="0.2" stroke="#e11d48" stroke-width="0.6"/>
    <text x="45" y="9.5" fill="#be123c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="0.6">WELCOME BONUS</text>
    
    <!-- Title -->
    <text x="0" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" letter-spacing="-0.2">$30 Welcome Account</text>
    
    <!-- Subtitle -->
    <text x="0" y="39" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8" font-weight="500">0.0 Pip Spreads · Dedicated for EAs</text>
  </g>

  <!-- Right Tag Pill -->
  <g transform="translate(222, 18)">
    <rect x="0" y="0" width="66" height="34" rx="6" fill="url(#acc)" filter="url(#glow)"/>
    <text x="33" y="17" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" text-anchor="middle" letter-spacing="0.3">$30</text>
    <text x="33" y="27" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="7.5" font-weight="800" text-anchor="middle" letter-spacing="0.3">BONUS</text>
  </g>
</svg>