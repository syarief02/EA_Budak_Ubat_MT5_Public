<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EA BUDAK UBAT // 30-Second Motion Graphics Video</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Outfit:wght@300;400;600;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background-color: #030509;
      color: #e2e8f0;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 20px;
    }
    .video-wrapper {
      position: relative;
      width: 100%;
      max-width: 1200px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 25px 70px rgba(0, 240, 255, 0.15), 0 0 0 1px rgba(0, 240, 255, 0.25);
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .hud-controls {
      margin-top: 18px;
      width: 100%;
      max-width: 1200px;
      background: rgba(10, 14, 26, 0.85);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.2);
      border-radius: 14px;
      padding: 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .scrub-container {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .time-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      font-weight: 700;
      color: #00f0ff;
      letter-spacing: 0.05em;
      min-width: 105px;
    }
    .scrub-bar {
      flex: 1;
      height: 8px;
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      outline: none;
      cursor: pointer;
      position: relative;
    }
    .scrub-bar::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #00f0ff;
      cursor: pointer;
      box-shadow: 0 0 12px #00f0ff;
      border: 2px solid #ffffff;
      transition: transform 0.1s;
    }
    .scrub-bar::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }
    .btn-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 10px;
    }
    .btn-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .hud-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #fff;
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      font-family: 'Outfit', sans-serif;
    }
    .hud-btn:hover {
      background: rgba(0, 240, 255, 0.15);
      border-color: #00f0ff;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.3);
      transform: translateY(-1px);
    }
    .hud-btn.primary {
      background: linear-gradient(135deg, #00f0ff, #0284c7);
      color: #030509;
      font-weight: 800;
      border: none;
    }
    .hud-btn.primary:hover {
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
    .scene-pill {
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.15s;
    }
    .scene-pill.active, .scene-pill:hover {
      background: rgba(0, 240, 255, 0.12);
      border-color: #00f0ff;
      color: #00f0ff;
    }
    .overlay-play {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(0, 240, 255, 0.2);
      backdrop-filter: blur(12px);
      border: 2px solid #00f0ff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 0 35px rgba(0, 240, 255, 0.4);
      transition: all 0.25s ease;
      z-index: 10;
    }
    .overlay-play:hover {
      transform: translate(-50%, -50%) scale(1.1);
      background: #00f0ff;
    }
    .overlay-play svg {
      width: 32px;
      height: 32px;
      fill: #ffffff;
      margin-left: 4px;
      transition: fill 0.2s;
    }
    .overlay-play:hover svg {
      fill: #030509;
    }
    .header-bar {
      width: 100%;
      max-width: 1200px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title-h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .title-h1 span.badge {
      font-size: 0.72rem;
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid #00f0ff;
      color: #00f0ff;
      padding: 3px 8px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
    }
    .badge-mql {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.8rem;
      color: #10b981;
      display: flex;
      align-items: center;
      gap: 6px;
    }
  </style>
</head>
<body>

  <div class="header-bar">
    <div class="title-h1">
      <span>EA BUDAK UBAT</span>
      <span class="badge">30-SEC MOTION GRAPHICS // 60FPS</span>
    </div>
    <div class="badge-mql">
      <span>● OFFICIAL ECOSYSTEM</span>
      <a href="https://eabudakubat.com" target="_blank" style="color: #00f0ff; text-decoration: none;">eabudakubat.com</a>
    </div>
  </div>

  <div class="video-wrapper" id="videoWrapper">
    <canvas id="motionCanvas" width="1920" height="1080"></canvas>
    <div class="overlay-play" id="overlayPlay">
      <svg viewBox="0 0 24 24"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
    </div>
  </div>

  <div class="hud-controls">
    <div class="scrub-container">
      <div class="time-code" id="timeCode">00:00.00 / 00:30.00</div>
      <input type="range" class="scrub-bar" id="scrubBar" min="0" max="30" step="0.01" value="0">
    </div>

    <div class="btn-row">
      <div class="btn-group">
        <button class="hud-btn primary" id="btnPlayPause">
          <span id="playIcon">▶ Play</span>
        </button>
        <button class="hud-btn" id="btnRestart">↺ Replay</button>
        <button class="hud-btn" id="btnMute">🔊 Sound: ON</button>
      </div>

      <div class="btn-group" id="scenePills">
        <button class="scene-pill active" data-time="0">Act 1: Matrix</button>
        <button class="scene-pill" data-time="4.5">Act 2: Flagship</button>
        <button class="scene-pill" data-time="9.5">Act 3: ADR AI</button>
        <button class="scene-pill" data-time="15.0">Act 4: Arsenal</button>
        <button class="scene-pill" data-time="20.5">Act 5: Free License</button>
        <button class="scene-pill" data-time="25.5">Act 6: CTA</button>
      </div>

      <div class="btn-group">
        <button class="hud-btn" id="btnFullscreen">⛶ Fullscreen</button>
      </div>
    </div>
  </div>

  <audio id="audioTrack" preload="auto" src="soundtrack_and_sfx.wav"></audio>

  <script>
    const canvas = document.getElementById('motionCanvas');
    const ctx = canvas.getContext('2d');
    const audio = document.getElementById('audioTrack');
    const scrubBar = document.getElementById('scrubBar');
    const timeCode = document.getElementById('timeCode');
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const btnRestart = document.getElementById('btnRestart');
    const btnMute = document.getElementById('btnMute');
    const overlayPlay = document.getElementById('overlayPlay');
    const btnFullscreen = document.getElementById('btnFullscreen');
    const scenePills = document.querySelectorAll('.scene-pill');

    const DURATION = 30.0;
    let isPlaying = false;
    let currentTime = 0;
    let lastTimestamp = 0;
    let soundEnabled = true;

    // Pre-generate static starfield/dust particles for background
    const PARTICLES = [];
    for (let i = 0; i < 180; i++) {
      PARTICLES.push({
        x: Math.random() * 1920,
        y: Math.random() * 1080,
        z: Math.random() * 800 + 200,
        radius: Math.random() * 2.5 + 0.8,
        speed: Math.random() * 0.8 + 0.3,
        alpha: Math.random() * 0.7 + 0.3,
        color: ['#00f0ff', '#3b82f6', '#10b981', '#ffffff', '#f59e0b'][Math.floor(Math.random() * 5)]
      });
    }

    // Helper easing functions
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function clamp(val, min, max) { return Math.max(min, Math.min(max, val)); }

    // RENDER FUNCTION: Takes exact time 't' in seconds [0.0 to 30.0]
    window.renderFrame = function(t) {
      t = clamp(t, 0, DURATION);

      // Clear Canvas
      ctx.fillStyle = '#05070d';
      ctx.fillRect(0, 0, 1920, 1080);

      // 1. DYNAMIC PERSPECTIVE 3D GRID FLOOR
      drawPerspectiveGrid(ctx, t);

      // 2. AMBIENT PARTICLES
      drawParticles(ctx, t);

      // 3. TELEMETRY & HUD BORDERS
      drawHUDTelemetry(ctx, t);

      // 4. ACT ROUTER
      if (t >= 0 && t < 4.5) {
        drawAct1_Matrix(ctx, t);
      } else if (t >= 4.5 && t < 9.5) {
        drawAct2_Flagship(ctx, t - 4.5);
      } else if (t >= 9.5 && t < 15.0) {
        drawAct3_ADR_BreakEven(ctx, t - 9.5);
      } else if (t >= 15.0 && t < 20.5) {
        drawAct4_Arsenal(ctx, t - 15.0);
      } else if (t >= 20.5 && t < 25.5) {
        drawAct5_FreeLicense(ctx, t - 20.5);
      } else {
        drawAct6_ClimaxCTA(ctx, t - 25.5);
      }

      // 5. CINEMATIC VIGNETTE & SCANLINES
      drawCinematicVignette(ctx);

      // 6. FADE IN & FADE OUT MASKS
      if (t < 0.5) {
        const a = 1 - (t / 0.5);
        ctx.fillStyle = `rgba(3, 5, 9, ${a})`;
        ctx.fillRect(0, 0, 1920, 1080);
      } else if (t > 29.4) {
        const a = (t - 29.4) / 0.6;
        ctx.fillStyle = `rgba(3, 5, 9, ${a})`;
        ctx.fillRect(0, 0, 1920, 1080);
      }
    };

    // ---------------- BACKGROUND SYSTEMS ----------------
    function drawPerspectiveGrid(ctx, t) {
      const horizonY = 540;
      const speed = (t * 80) % 60;

      ctx.save();
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.08)';
      ctx.lineWidth = 1.5;

      // Horizon glow line
      const grad = ctx.createLinearGradient(0, horizonY - 40, 0, horizonY + 40);
      grad.addColorStop(0, 'rgba(0, 240, 255, 0)');
      grad.addColorStop(0.5, 'rgba(0, 240, 255, 0.25)');
      grad.addColorStop(1, 'rgba(0, 240, 255, 0)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, horizonY - 40, 1920, 80);

      // Perspective vanishing lines
      const cx = 960;
      for (let x = -1920; x <= 3840; x += 120) {
        ctx.beginPath();
        ctx.moveTo(cx, horizonY);
        ctx.lineTo(x, 1080);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx, horizonY);
        ctx.lineTo(x, 0);
        ctx.stroke();
      }

      // Horizontal grid lines moving forward
      for (let i = 0; i <= 15; i++) {
        const p = Math.pow((i * 60 + speed) / 960, 2.2);
        const yBottom = horizonY + p * 540;
        const yTop = horizonY - p * 540;

        ctx.strokeStyle = `rgba(0, 240, 255, ${0.12 * p})`;
        ctx.beginPath();
        ctx.moveTo(0, yBottom);
        ctx.lineTo(1920, yBottom);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, yTop);
        ctx.lineTo(1920, yTop);
        ctx.stroke();
      }
      ctx.restore();
    }

    function drawParticles(ctx, t) {
      ctx.save();
      PARTICLES.forEach(p => {
        const y = (p.y - t * p.speed * 40) % 1080;
        const actualY = y < 0 ? y + 1080 : y;
        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha * (0.6 + 0.4 * Math.sin(t * 3 + p.x));
        ctx.beginPath();
        ctx.arc(p.x, actualY, p.radius, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.restore();
    }

    function drawHUDTelemetry(ctx, t) {
      ctx.save();
      ctx.font = '13px "JetBrains Mono", monospace';
      ctx.fillStyle = 'rgba(0, 240, 255, 0.45)';

      // Top bar
      ctx.fillText(`SYS.01 // EA BUDAK UBAT QUANTITATIVE ENGINE`, 60, 48);
      ctx.fillText(`LATENCY: 0.12ms | ECN LONDON FIBER`, 800, 48);
      ctx.fillText(`FPS: 60.0 | TICK BE: ENGAGED`, 1540, 48);

      // Top line
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.2)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(60, 62);
      ctx.lineTo(1860, 62);
      ctx.stroke();

      // Bottom bar
      ctx.fillText(`MQL5 REGISTERED ID: #195399`, 60, 1035);
      ctx.fillText(`OFFICIAL PORTAL: HTTPS://EABUDAKUBAT.COM`, 780, 1035);
      ctx.fillText(`SECURE ZERO-DLL QUANT BRIDGE`, 1540, 1035);

      ctx.beginPath();
      ctx.moveTo(60, 1018);
      ctx.lineTo(1860, 1018);
      ctx.stroke();

      // Corner Crosshairs
      const drawCross = (x, y) => {
        ctx.strokeStyle = 'rgba(0, 240, 255, 0.6)';
        ctx.beginPath();
        ctx.moveTo(x - 12, y); ctx.lineTo(x + 12, y);
        ctx.moveTo(x, y - 12); ctx.lineTo(x, y + 12);
        ctx.stroke();
      };
      drawCross(60, 80);
      drawCross(1860, 80);
      drawCross(60, 1000);
      drawCross(1860, 1000);

      // Subtle Kanji Watermark in Center
      ctx.font = '900 130px "Outfit", sans-serif';
      ctx.fillStyle = 'rgba(0, 240, 255, 0.025)';
      ctx.textAlign = 'center';
      ctx.fillText(`自動売買 // QUANT`, 960, 580);
      ctx.restore();
    }

    // ---------------- ACT 1: THE VOLATILITY MATRIX (0.0s - 4.5s) ----------------
    function drawAct1_Matrix(ctx, t) {
      ctx.save();
      // Kinetic Text Sequence
      if (t < 2.3) {
        const prog = clamp(t / 0.8, 0, 1);
        const ease = easeOutBack(prog);
        const scale = 1.3 - 0.3 * ease;
        const alpha = clamp(t / 0.4, 0, 1);

        ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(960, 430);
        ctx.scale(scale, scale);
        ctx.globalAlpha = alpha;

        // Glowing backdrop shadow
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 35;
        ctx.font = '900 78px "Outfit", sans-serif';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('VOLATILITY IS CHAOS.', 0, 0);

        ctx.shadowBlur = 0;
        ctx.font = '700 24px "JetBrains Mono", monospace';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText('[ XAUUSD & FX MAJOR ORDER BOOK NOISE ]', 0, 60);
        ctx.restore();
      } else {
        const subT = t - 2.3;
        const prog = clamp(subT / 0.7, 0, 1);
        const ease = easeOutBack(prog);
        const scale = 1.25 - 0.25 * ease;

        ctx.textAlign = 'center';
        ctx.save();
        ctx.translate(960, 430);
        ctx.scale(scale, scale);

        ctx.shadowColor = '#10b981';
        ctx.shadowBlur = 40;
        ctx.font = '900 84px "Outfit", sans-serif';
        ctx.fillStyle = '#10b981';
        ctx.fillText('UNTIL YOU QUANTIFY IT.', 0, 0);

        ctx.shadowBlur = 0;
        ctx.font = '700 24px "JetBrains Mono", monospace';
        ctx.fillStyle = '#ffffff';
        ctx.fillText('⚡ ALGORITHMIC PRECISION REPLACES EMOTION', 0, 60);
        ctx.restore();
      }

      // Animated Candlestick Chart (Materializing below title)
      const chartProg = clamp(t / 3.0, 0, 1);
      drawCandleChart(ctx, 360, 620, 1200, 240, chartProg, t);
      ctx.restore();
    }

    function drawCandleChart(ctx, x, y, w, h, progress, t) {
      ctx.save();
      // Chart background card
      ctx.fillStyle = 'rgba(10, 15, 28, 0.75)';
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, 14);
      ctx.fill();
      ctx.stroke();

      const numCandles = 24;
      const candleW = w / (numCandles + 2);
      const visibleCandles = Math.floor(numCandles * progress);

      const highs = [140, 160, 150, 190, 180, 210, 200, 230, 220, 260, 250, 280, 270, 310, 290, 330, 315, 345, 330, 360, 350, 380, 370, 410];
      const lows =  [80,  90,  100, 120, 110, 140, 130, 160, 150, 180, 170, 200, 190, 220, 210, 240, 230, 260, 250, 275, 270, 300, 295, 330];

      ctx.save();
      for (let i = 0; i < visibleCandles; i++) {
        const cx = x + (i + 1) * candleW;
        const isGreen = i % 3 !== 1;
        const color = isGreen ? '#10b981' : '#ef4444';
        const wickTop = y + h - (highs[i] * 0.5);
        const wickBot = y + h - (lows[i] * 0.5);
        const bodyTop = isGreen ? wickTop + 15 : wickBot - 35;
        const bodyH = Math.abs(wickBot - wickTop) * 0.6;

        ctx.strokeStyle = color;
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx, wickTop);
        ctx.lineTo(cx, wickBot);
        ctx.stroke();

        ctx.fillStyle = color;
        ctx.shadowColor = color;
        ctx.shadowBlur = 8;
        ctx.fillRect(cx - candleW * 0.35, Math.min(bodyTop, bodyTop + bodyH), candleW * 0.7, Math.abs(bodyH));
      }

      // SMA Line moving across candles
      if (visibleCandles > 2) {
        ctx.strokeStyle = '#00f0ff';
        ctx.lineWidth = 3;
        ctx.shadowColor = '#00f0ff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        for (let i = 0; i < visibleCandles; i++) {
          const cx = x + (i + 1) * candleW;
          const cy = y + h - ((highs[i] + lows[i]) * 0.25);
          if (i === 0) ctx.moveTo(cx, cy);
          else ctx.lineTo(cx, cy);
        }
        ctx.stroke();

        // Pulsing price tag at head
        const lastI = visibleCandles - 1;
        const headX = x + (lastI + 1) * candleW;
        const headY = y + h - ((highs[lastI] + lows[lastI]) * 0.25);

        ctx.fillStyle = '#00f0ff';
        ctx.beginPath();
        ctx.arc(headX, headY, 6, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0a0e1a';
        ctx.fillRect(headX + 10, headY - 14, 110, 28);
        ctx.strokeStyle = '#00f0ff';
        ctx.strokeRect(headX + 10, headY - 14, 110, 28);
        ctx.font = '700 13px "JetBrains Mono", monospace';
        ctx.fillStyle = '#00f0ff';
        ctx.fillText(`$2,684.50`, headX + 18, headY + 5);
      }
      ctx.restore();
    }

    // ---------------- ACT 2: FLAGSHIP REVEAL (4.5s - 9.5s) ----------------
    function drawAct2_Flagship(ctx, t) {
      ctx.save();
      const enterProg = clamp(t / 0.8, 0, 1);
      const ease = easeOutBack(enterProg);

      // Central Shield / Logo Burst
      const cx = 960;
      const cy = 460;

      // Rotating Hologram Rings
      ctx.save();
      ctx.translate(cx, cy);
      const rot = t * 1.5;

      ctx.strokeStyle = 'rgba(0, 240, 255, 0.4)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(0, 0, 180 * ease, 0, Math.PI * 2);
      ctx.stroke();

      // Caliper Degree Marks
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.8)';
      for (let a = 0; a < 360; a += 15) {
        const rad = (a * Math.PI / 180) + rot;
        const r1 = 180 * ease;
        const r2 = (a % 45 === 0) ? r1 + 18 : r1 + 8;
        ctx.beginPath();
        ctx.moveTo(Math.cos(rad) * r1, Math.sin(rad) * r1);
        ctx.lineTo(Math.cos(rad) * r2, Math.sin(rad) * r2);
        ctx.stroke();
      }

      // Counter-rotating Inner Ring
      ctx.strokeStyle = 'rgba(245, 158, 11, 0.6)';
      ctx.beginPath();
      ctx.arc(0, 0, 140 * ease, 0, Math.PI * 2);
      ctx.stroke();

      // Glowing Hexagon Emblem
      ctx.fillStyle = 'rgba(10, 18, 35, 0.9)';
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 30;
      ctx.beginPath();
      for (let i = 0; i < 6; i++) {
        const angle = (i * 60) * Math.PI / 180;
        const r = 110 * ease;
        const hx = Math.cos(angle) * r;
        const hy = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(hx, hy);
        else ctx.lineTo(hx, hy);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();

      // Golden Crown Icon
      ctx.shadowBlur = 0;
      ctx.font = `${Math.floor(64 * ease)}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('👑', 0, -8);
      ctx.restore();

      // Big Kinetic Title
      ctx.textAlign = 'center';
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 30;

    // ---------------- PLAYBACK & LOOP ENGINE ----------------
    function formatTime(s) {
      const min = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      const ms = Math.floor((s % 1) * 100);
      return `${String(min).padStart(2, '0')}:${String(sec).padStart(2, '0')}.${String(ms).padStart(2, '0')}`;
    }

    function updatePills(t) {
      scenePills.forEach(pill => {
        const pTime = parseFloat(pill.dataset.time);
        const nextTime = pTime + 5.0;
        if (t >= pTime && t < nextTime) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    function tick(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        if (!audio.paused && audio.duration) {
          currentTime = audio.currentTime;
        } else {
          currentTime += delta;
        }

        if (currentTime >= DURATION) {
          currentTime = DURATION;
          pause();
        }

        window.renderFrame(currentTime);
        scrubBar.value = currentTime;
        timeCode.textContent = `${formatTime(currentTime)} / 00:30.00`;
        updatePills(currentTime);
      }

      requestAnimationFrame(tick);
    }

    function play() {
      isPlaying = true;
      overlayPlay.style.display = 'none';
      playIcon.textContent = '⏸ Pause';
      if (currentTime >= DURATION) {
        currentTime = 0;
      }
      audio.currentTime = currentTime;
      if (soundEnabled) {
        audio.play().catch(e => console.log('Audio autoplay prevented'));
      }
    }

    function pause() {
      isPlaying = false;
      overlayPlay.style.display = 'flex';
      playIcon.textContent = '▶ Play';
      audio.pause();
    }

    btnPlayPause.addEventListener('click', () => {
      if (isPlaying) pause(); else play();
    });

    overlayPlay.addEventListener('click', play);

    btnRestart.addEventListener('click', () => {
      currentTime = 0;
      audio.currentTime = 0;
      play();
    });

    btnMute.addEventListener('click', () => {
      soundEnabled = !soundEnabled;
      btnMute.textContent = soundEnabled ? '🔊 Sound: ON' : '🔇 Sound: OFF';
      audio.muted = !soundEnabled;
    });

    scrubBar.addEventListener('input', (e) => {
      currentTime = parseFloat(e.target.value);
      audio.currentTime = currentTime;
      window.renderFrame(currentTime);
    });

    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        currentTime = parseFloat(pill.dataset.time);
        audio.currentTime = currentTime;
        window.renderFrame(currentTime);
        play();
      });
    });

    btnFullscreen.addEventListener('click', () => {
      const el = document.getElementById('videoWrapper');
      if (el.requestFullscreen) el.requestFullscreen();
    });

    // Initial render
    window.renderFrame(0);
    requestAnimationFrame(tick);
