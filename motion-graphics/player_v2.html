<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>EA Budak Ubat — Liquid Gold Motion Graphics V2</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0A0A0A;color:#F5F0E8;font-family:'Georgia','Times New Roman',serif;overflow:hidden;display:flex;align-items:center;justify-content:center;height:100vh;width:100vw}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
#controls{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px;align-items:center;z-index:100;background:rgba(10,10,10,0.85);backdrop-filter:blur(12px);padding:10px 20px;border-radius:40px;border:1px solid rgba(212,175,55,0.3)}
#controls button{background:none;border:1px solid rgba(212,175,55,0.4);color:#D4AF37;padding:6px 16px;border-radius:20px;cursor:pointer;font-size:13px;font-family:inherit;transition:all 0.2s}
#controls button:hover{background:rgba(212,175,55,0.15);border-color:#D4AF37}
#timeline{width:300px;height:4px;-webkit-appearance:none;appearance:none;background:rgba(212,175,55,0.2);border-radius:2px;outline:none;cursor:pointer}
#timeline::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:#D4AF37;cursor:pointer;box-shadow:0 0 10px rgba(212,175,55,0.5)}
#time-display{font-size:12px;color:#D4AF37;font-family:monospace;min-width:65px;text-align:center}
.act-pills{display:flex;gap:6px}
.act-pill{font-size:10px;padding:3px 10px;border-radius:12px;cursor:pointer;border:1px solid rgba(212,175,55,0.25);color:rgba(212,175,55,0.6);transition:all 0.2s}
.act-pill.active{background:rgba(212,175,55,0.2);color:#D4AF37;border-color:#D4AF37}
</style>
</head>
<body>
<canvas id="canvas"></canvas>
<div id="controls">
  <button id="btn-play">▶ Play</button>
  <button id="btn-restart">⟲</button>
  <input type="range" id="timeline" min="0" max="30000" value="0" step="16"/>
  <span id="time-display">0:00.0</span>
  <div class="act-pills">
    <span class="act-pill active" data-t="0">1</span>
    <span class="act-pill" data-t="6000">2</span>
    <span class="act-pill" data-t="12000">3</span>
    <span class="act-pill" data-t="18000">4</span>
    <span class="act-pill" data-t="24000">5</span>
  </div>
  <button id="btn-mute">🔊</button>
  <button id="btn-fs">⛶</button>
</div>

<script>
// ═══════════════════════════════════════════════════════════
// EA BUDAK UBAT — LIQUID GOLD MOTION GRAPHICS V2
// Premium Cinematic 30-Second Reel
// ═══════════════════════════════════════════════════════════

const C = document.getElementById('canvas');
const ctx = C.getContext('2d');
const DURATION = 30000; // ms
const W = 1920, H = 1080;
C.width = W; C.height = H;

// ─── COLOR PALETTE ───
const GOLD = '#D4AF37';
const LIGHT_GOLD = '#F0D060';
const WARM_WHITE = '#F5F0E8';
const DEEP_BLACK = '#0A0A0A';
const DARK_SURFACE = '#1A1610';
const AMBER = '#FF9500';
const BRONZE = '#CD7F32';

// ─── EASING FUNCTIONS ───
const ease = {
  inOut: t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2,
  out: t => 1 - Math.pow(1-t, 3),
  in: t => t*t*t,
  outBack: t => { const c1=1.70158; const c3=c1+1; return 1+c3*Math.pow(t-1,3)+c1*Math.pow(t-1,2); },
  outElastic: t => { if(t===0||t===1) return t; return Math.pow(2,-10*t)*Math.sin((t*10-0.75)*(2*Math.PI)/3)+1; },
  linear: t => t,
};

function clamp(v, min=0, max=1) { return Math.max(min, Math.min(max, v)); }
function lerp(a, b, t) { return a + (b-a)*clamp(t); }
function progress(t, start, dur) { return clamp((t - start) / dur); }

// ─── GOLDEN GRADIENT HELPERS ───
function goldGradient(x, y, r, alpha=1) {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(240, 208, 96, ${alpha})`);
  g.addColorStop(0.5, `rgba(212, 175, 55, ${alpha})`);
  g.addColorStop(1, `rgba(160, 120, 20, ${alpha * 0.3})`);
  return g;
}

function linearGold(x1,y1,x2,y2, alpha=1) {
  const g = ctx.createLinearGradient(x1,y1,x2,y2);
  g.addColorStop(0, `rgba(205, 127, 50, ${alpha})`);
  g.addColorStop(0.3, `rgba(240, 208, 96, ${alpha})`);
  g.addColorStop(0.5, `rgba(212, 175, 55, ${alpha})`);
  g.addColorStop(0.7, `rgba(240, 208, 96, ${alpha})`);
  g.addColorStop(1, `rgba(205, 127, 50, ${alpha})`);
  return g;
}

// ─── PARTICLE SYSTEM (Deterministic for any t) ───
const FIXED_PARTICLES = [];
for (let i = 0; i < 90; i++) {
  FIXED_PARTICLES.push({
    baseX: (Math.sin(i * 997.1) * 0.5 + 0.5) * W,
    baseY: (Math.cos(i * 613.3) * 0.5 + 0.5) * H,
    speedY: 0.03 + (i % 7) * 0.015,
    size: 1 + (i % 4) * 1.2,
    phase: i * 137.5,
    alpha: 0.2 + (i % 5) * 0.15
  });
}

// ─── DRAW CROWN ───
function drawCrown(cx, cy, size, rotation, alpha, shimmer=0) {
  if (alpha <= 0.001 || size <= 0) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.globalAlpha = clamp(alpha);

  const s = size;
  const points = [
    [-s*0.5, s*0.15],
    [-s*0.38, -s*0.35],
    [-s*0.22, -s*0.1],
    [-s*0.05, -s*0.5],
    [0, -s*0.45],
    [s*0.05, -s*0.5],
    [s*0.22, -s*0.1],
    [s*0.38, -s*0.35],
    [s*0.5, s*0.15],
  ];

  // Glow
  ctx.shadowColor = LIGHT_GOLD;
  ctx.shadowBlur = 30 + shimmer * 20;

  // Crown body
  ctx.beginPath();
  ctx.moveTo(points[0][0], points[0][1]);
  for (let i = 1; i < points.length; i++) {
    ctx.lineTo(points[i][0], points[i][1]);
  }
  ctx.closePath();

  const grad = ctx.createLinearGradient(-s*0.5, -s*0.5, s*0.5, s*0.15);
  grad.addColorStop(0, '#F0D060');
  grad.addColorStop(0.3, '#D4AF37');
  grad.addColorStop(0.6, '#F0D060');
  grad.addColorStop(1, '#CD7F32');
  ctx.fillStyle = grad;
  ctx.fill();

  // Crown band
  ctx.fillStyle = '#B8941E';
  ctx.fillRect(-s*0.48, s*0.05, s*0.96, s*0.1);

  // Jewels
  const jewels = [[-s*0.3, -s*0.15], [0, -s*0.32], [s*0.3, -s*0.15]];
  jewels.forEach(([jx, jy]) => {
    ctx.beginPath();
    ctx.arc(jx, jy, s*0.04, 0, Math.PI*2);
    ctx.fillStyle = AMBER;
    ctx.shadowColor = AMBER;
    ctx.shadowBlur = 10;
    ctx.fill();
  });

  ctx.restore();
}

// ─── DRAW GEAR ───
function drawGear(cx, cy, outerR, innerR, teeth, rotation, alpha, label='') {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(rotation);
  ctx.globalAlpha = clamp(alpha);

  ctx.beginPath();
  for (let i = 0; i < teeth; i++) {
    const a1 = (i / teeth) * Math.PI * 2;
    const a2 = ((i + 0.3) / teeth) * Math.PI * 2;
    const a3 = ((i + 0.5) / teeth) * Math.PI * 2;
    const a4 = ((i + 0.8) / teeth) * Math.PI * 2;
    if (i === 0) ctx.moveTo(Math.cos(a1)*outerR, Math.sin(a1)*outerR);
    else ctx.lineTo(Math.cos(a1)*outerR, Math.sin(a1)*outerR);
    ctx.lineTo(Math.cos(a2)*outerR, Math.sin(a2)*outerR);
    ctx.lineTo(Math.cos(a2)*(innerR+outerR)/2*1.05, Math.sin(a2)*(innerR+outerR)/2*1.05);
    ctx.lineTo(Math.cos(a3)*(innerR+outerR)/2*1.05, Math.sin(a3)*(innerR+outerR)/2*1.05);
    ctx.lineTo(Math.cos(a3)*outerR, Math.sin(a3)*outerR);
    ctx.lineTo(Math.cos(a4)*outerR, Math.sin(a4)*outerR);
  }
  ctx.closePath();

  const grad = linearGold(-outerR, -outerR, outerR, outerR, 1);
  ctx.fillStyle = grad;
  ctx.strokeStyle = `rgba(240, 208, 96, ${clamp(alpha)*0.6})`;
  ctx.lineWidth = 1.5;
  ctx.fill();
  ctx.stroke();

  // Center hub dial
  ctx.beginPath();
  ctx.arc(0, 0, innerR * 0.75, 0, Math.PI * 2);
  ctx.fillStyle = '#0f0e0c';
  ctx.fill();
  ctx.strokeStyle = '#F0D060';
  ctx.lineWidth = 2;
  ctx.stroke();

  // Subtle inner decorative ring
  ctx.beginPath();
  ctx.arc(0, 0, innerR * 0.62, 0, Math.PI * 2);
  ctx.strokeStyle = 'rgba(212, 175, 55, 0.4)';
  ctx.lineWidth = 1;
  ctx.stroke();

  // Label
  if (label) {
    ctx.rotate(-rotation);
    ctx.fillStyle = '#F0D060';
    ctx.shadowColor = GOLD;
    ctx.shadowBlur = 10;
    ctx.font = `bold ${outerR * 0.22}px 'Segoe UI', sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(label, 0, 0);
  }

  ctx.restore();
}

// ─── DRAW MEDALLION (COIN) ───
function drawMedallion(cx, cy, radius, rotation, alpha, label, icon, glowColor=GOLD) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.globalAlpha = clamp(alpha);

  const scaleX = Math.abs(Math.cos(rotation));
  ctx.scale(Math.max(scaleX, 0.05), 1);

  ctx.shadowColor = glowColor;
  ctx.shadowBlur = 28;

  ctx.beginPath();
  ctx.arc(0, 0, radius, 0, Math.PI * 2);
  const g = ctx.createRadialGradient(radius*0.2, -radius*0.2, 0, 0, 0, radius);
  g.addColorStop(0, '#F5E6A0');
  g.addColorStop(0.4, '#D4AF37');
  g.addColorStop(0.8, '#B8941E');
  g.addColorStop(1, '#8B6914');
  ctx.fillStyle = g;
  ctx.fill();

  ctx.strokeStyle = '#F0D060';
  ctx.lineWidth = 3.5;
  ctx.stroke();

  // High contrast inner disc
  ctx.beginPath();
  ctx.arc(0, 0, radius * 0.78, 0, Math.PI * 2);
  ctx.fillStyle = '#0a0d14';
  ctx.fill();
  ctx.strokeStyle = 'rgba(240, 208, 96, 0.5)';
  ctx.lineWidth = 1.5;
  ctx.stroke();

  if (scaleX > 0.25) {
    ctx.shadowBlur = 0;
    ctx.font = `${radius*0.42}px serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(icon, 0, -radius*0.14);

    ctx.fillStyle = '#F0D060';
    ctx.shadowColor = GOLD;
    ctx.shadowBlur = 8;
    const words = label.split(' ');
    if (words.length <= 2) {
      ctx.font = `bold ${radius*0.18}px 'Segoe UI', sans-serif`;
      ctx.fillText(label, 0, radius*0.35);
    } else {
      ctx.font = `bold ${radius*0.15}px 'Segoe UI', sans-serif`;
      ctx.fillText(words.slice(0, 2).join(' '), 0, radius*0.26);
      ctx.fillText(words.slice(2).join(' '), 0, radius*0.48);
    }
  }

  ctx.restore();
}

// ─── DRAW CANDLESTICK CHART ───
function drawCandlesticks(x, y, w, h, alpha, seed=42) {
  if (alpha <= 0.001) return;
  ctx.save();
  ctx.globalAlpha = clamp(alpha) * 0.2;
  const count = 40;
  const barW = w / count * 0.6;
  let rng = seed;
  const rand = () => { rng = (rng * 16807) % 2147483647; return rng / 2147483647; };

  let price = h * 0.5;
  for (let i = 0; i < count; i++) {
    const bx = x + (i / count) * w;
    const change = (rand() - 0.48) * h * 0.08;
    const open = price;
    price += change;
    const close = price;
    const high = Math.min(open, close) - rand() * h * 0.03;
    const low = Math.max(open, close) + rand() * h * 0.03;
    const bull = close < open;

    ctx.strokeStyle = bull ? 'rgba(212, 175, 55, 0.45)' : 'rgba(205, 127, 50, 0.35)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(bx + barW/2, y + high);
    ctx.lineTo(bx + barW/2, y + low);
    ctx.stroke();

    ctx.fillStyle = bull ? 'rgba(212, 175, 55, 0.35)' : 'rgba(100, 70, 20, 0.35)';
    ctx.fillRect(bx, y + Math.min(open, close), barW, Math.abs(close - open) + 1);
  }
  ctx.restore();
}

// ─── TYPEWRITER TEXT ───
function drawTypewriter(text, x, y, t, charDelay, font, color, align='center') {
  const visibleChars = Math.min(text.length, Math.floor(t / charDelay));
  const visible = text.substring(0, visibleChars);
  ctx.save();
  ctx.font = font;
  ctx.fillStyle = color;
  ctx.textAlign = align;
  ctx.textBaseline = 'middle';
  ctx.shadowColor = GOLD;
  ctx.shadowBlur = 12;
  ctx.fillText(visible, x, y);

  if (visibleChars < text.length && Math.floor(t / 150) % 2 === 0) {
    const fullW = ctx.measureText(text).width;
    const partW = ctx.measureText(visible).width;
    let curX = align === 'center' ? (x - fullW / 2 + partW) : (x + partW);
    ctx.fillStyle = LIGHT_GOLD;
    ctx.fillRect(curX + 4, y - 24, 3, 48);
  }
  ctx.restore();
}

// ─── LIQUID WIPE TRANSITION ───
function drawLiquidWipe(t, direction='right') {
  if (t <= 0 || t >= 1) return;
  ctx.save();
  const wipeX = direction === 'right' ? t * W * 1.3 - W * 0.15 : W - t * W * 1.3 + W * 0.15;
  const grad = ctx.createLinearGradient(wipeX - 250, 0, wipeX + 250, 0);
  grad.addColorStop(0, 'rgba(212, 175, 55, 0)');
  grad.addColorStop(0.3, 'rgba(212, 175, 55, 0.6)');
  grad.addColorStop(0.5, 'rgba(240, 208, 96, 0.95)');
  grad.addColorStop(0.7, 'rgba(212, 175, 55, 0.6)');
  grad.addColorStop(1, 'rgba(212, 175, 55, 0)');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();
}

// ─── MAIN RENDER FUNCTION ───
function render(tMs) {
  const t = Math.max(0, Math.min(DURATION, tMs));

  // Clear master canvas
  ctx.fillStyle = DEEP_BLACK;
  ctx.fillRect(0, 0, W, H);

  // Ambient deterministic floating gold particles
  ctx.save();
  for (let i = 0; i < FIXED_PARTICLES.length; i++) {
    const p = FIXED_PARTICLES[i];
    const py = (p.baseY - (t * p.speedY)) % H;
    const actualY = py < 0 ? py + H : py;
    const px = p.baseX + Math.sin((t * 0.001) + p.phase) * 15;
    ctx.globalAlpha = p.alpha * (0.6 + Math.sin(t * 0.003 + p.phase) * 0.4);
    ctx.fillStyle = LIGHT_GOLD;
    ctx.shadowColor = GOLD;
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.arc(px, actualY, p.size, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ═══════════════════════════════════════════
  // ACT 1: THE FORGE (0 – 6000ms)
  // ═══════════════════════════════════════════
  if (t < 7000) {
    const act1 = t < 6000 ? 1 : 1 - progress(t, 6000, 1000);

    const warmAlpha = progress(t, 0, 3000) * 0.25 * act1;
    const bgGrad = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 650);
    bgGrad.addColorStop(0, `rgba(55, 40, 15, ${warmAlpha})`);
    bgGrad.addColorStop(1, 'rgba(10, 10, 10, 0)');
    ctx.fillStyle = bgGrad;
    ctx.fillRect(0, 0, W, H);

    // Liquid gold drop (0 - 1500ms)
    if (t < 1500) {
      const dropP = ease.in(progress(t, 0, 1200));
      const dropY = dropP * (H/2 - 60) + 40;
      const dropSize = 10 + Math.sin(t / 80) * 2;
      ctx.save();
      ctx.shadowColor = LIGHT_GOLD;
      ctx.shadowBlur = 24;
      ctx.fillStyle = LIGHT_GOLD;
      ctx.beginPath();
      ctx.moveTo(W/2, dropY - dropSize*2.2);
      ctx.bezierCurveTo(W/2 + dropSize*1.2, dropY - dropSize*0.8, W/2 + dropSize*1.2, dropY + dropSize, W/2, dropY + dropSize*1.2);
      ctx.bezierCurveTo(W/2 - dropSize*1.2, dropY + dropSize, W/2 - dropSize*1.2, dropY - dropSize*0.8, W/2, dropY - dropSize*2.2);
      ctx.fill();
      ctx.restore();
    }

    // Concentric expanding ripples (1200ms - 5000ms)
    if (t >= 1200) {
      const rippleAges = [t - 1200, t - 1450, t - 1700, t - 2000];
      rippleAges.forEach((age, idx) => {
        if (age > 0 && age < 3000) {
          const rp = age / 3000;
          const rRadius = ease.out(rp) * (180 + idx * 90);
          const rAlpha = (1 - rp) * 0.65 * act1;
          ctx.save();
          ctx.strokeStyle = `rgba(240, 208, 96, ${rAlpha})`;
          ctx.lineWidth = 2.5 * (1 - rp);
          ctx.shadowColor = GOLD;
          ctx.shadowBlur = 12;
          ctx.beginPath();
          ctx.arc(W/2, H/2 - 20, rRadius, 0, Math.PI * 2);
          ctx.stroke();
          ctx.restore();
        }
      });
    }

    // Golden Crown Materialization (2200ms+)
    if (t >= 2200) {
      const crownP = ease.outElastic(clamp(progress(t, 2200, 1500)));
      const crownAlpha = ease.out(progress(t, 2200, 700)) * act1;
      const crownSize = 135 * crownP;
      const crownRot = Math.sin(t / 1800) * 0.04;
      const shimmer = Math.sin(t / 250) * 0.5 + 0.5;
      drawCrown(W/2, H/2 - 40, crownSize, crownRot, crownAlpha, shimmer);
    }

    // Title: "EA BUDAK UBAT" (3000ms+)
    if (t >= 2900) {
      const textP = progress(t, 2900, 2400);
      drawTypewriter(
        'EA BUDAK UBAT',
        W/2, H/2 + 130,
        textP * 2400, 110,
        `900 70px 'Georgia', serif`,
        `rgba(212, 175, 55, ${ease.out(progress(t, 2900, 700)) * act1})`
      );

      // Subtitle
      if (t >= 3800) {
        const subAlpha = ease.out(progress(t, 3800, 600)) * act1;
        ctx.save();
        ctx.font = `600 21px 'Segoe UI', sans-serif`;
        ctx.fillStyle = `rgba(245, 240, 232, ${subAlpha * 0.85})`;
        ctx.textAlign = 'center';
        ctx.letterSpacing = '0.35em';
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = 10;
        ctx.fillText('QUANTITATIVE ALGORITHMIC TRADING ECOSYSTEM', W/2, H/2 + 185);
        ctx.restore();
      }
    }
  }

  // Transition wipe 1→2
  if (t >= 5500 && t < 6500) {
    drawLiquidWipe(progress(t, 5500, 1000));
  }

  // ═══════════════════════════════════════════
  // ACT 2: PRECISION ENGINE (6000 – 12000ms)
  // ═══════════════════════════════════════════
  if (t >= 6000 && t < 13000) {
    const act2Enter = ease.out(progress(t, 6000, 800));
    const act2Exit = t < 12000 ? 1 : 1 - progress(t, 12000, 1000);
    const a2 = act2Enter * act2Exit;

    ctx.fillStyle = `rgba(26, 22, 16, ${a2 * 0.55})`;
    ctx.fillRect(0, 0, W, H);

    const bgG = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 550);
    bgG.addColorStop(0, `rgba(70, 50, 18, ${a2 * 0.35})`);
    bgG.addColorStop(1, 'rgba(10, 10, 10, 0)');
    ctx.fillStyle = bgG;
    ctx.fillRect(0, 0, W, H);

    // Clockwork Precision Gears
    const gearData = [
      { x: W/2, y: H/2, r: 145, ir: 95, teeth: 20, speed: 0.00045, label: 'ADR AI' },
      { x: W/2 - 220, y: H/2 - 85, r: 85, ir: 52, teeth: 14, speed: -0.00075, label: 'Break-Even' },
      { x: W/2 + 215, y: H/2 + 65, r: 95, ir: 58, teeth: 16, speed: -0.00065, label: 'Risk Mgmt' },
      { x: W/2 - 110, y: H/2 + 170, r: 65, ir: 38, teeth: 10, speed: 0.0011, label: 'OnTick()' },
      { x: W/2 + 295, y: H/2 - 110, r: 60, ir: 32, teeth: 9, speed: 0.00095, label: 'SafeGuard' },
    ];

    gearData.forEach((g, i) => {
      const delay = i * 180;
      const gAlpha = ease.out(progress(t, 6150 + delay, 600)) * a2;
      const rot = t * g.speed;
      drawGear(g.x, g.y, g.r, g.ir, g.teeth, rot, gAlpha, g.label);
    });

    // Golden Spherical Boundary rings
    if (t >= 9200) {
      const sphereP = ease.out(progress(t, 9200, 1000));
      ctx.save();
      ctx.globalAlpha = sphereP * a2 * 0.45;
      ctx.strokeStyle = GOLD;
      ctx.lineWidth = 2.5;
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 25;
      ctx.beginPath();
      ctx.arc(W/2, H/2, 290 * sphereP, 0, Math.PI * 2);
      ctx.stroke();

      ctx.globalAlpha = sphereP * a2 * 0.25;
      ctx.beginPath();
      ctx.arc(W/2, H/2, 330 * sphereP, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Version banner
    if (t >= 7300) {
      const tvAlpha = ease.out(progress(t, 7300, 600)) * a2;
      ctx.save();
      ctx.font = `bold 32px 'Segoe UI', sans-serif`;
      ctx.fillStyle = `rgba(240, 208, 96, ${tvAlpha})`;
      ctx.textAlign = 'center';
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 15;
      ctx.fillText('⚡ FLAGSHIP ENGINE · v1.67 MT5 & v1.62 MT4', W/2, H/2 - 275);
      ctx.restore();
    }

    if (t >= 8100) {
      const tlAlpha = ease.out(progress(t, 8100, 600)) * a2;
      ctx.save();
      ctx.font = `300 26px 'Georgia', serif`;
      ctx.fillStyle = `rgba(245, 240, 232, ${tlAlpha * 0.9})`;
      ctx.textAlign = 'center';
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 10;
      ctx.fillText('Laboratory-Grade Quality Control Meets Algorithmic Execution', W/2, H/2 + 295);
      ctx.restore();
    }
  }

  // Transition wipe 2→3
  if (t >= 11500 && t < 12500) {
    drawLiquidWipe(progress(t, 11500, 1000), 'left');
  }

  // ═══════════════════════════════════════════
  // ACT 3: THE ARSENAL (12000 – 18000ms)
  // ═══════════════════════════════════════════
  if (t >= 12000 && t < 19000) {
    const act3Enter = ease.out(progress(t, 12000, 800));
    const act3Exit = t < 18000 ? 1 : 1 - progress(t, 18000, 1000);
    const a3 = act3Enter * act3Exit;

    drawCandlesticks(80, 180, W-160, H-360, a3, 99);

    const bg3 = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 620);
    bg3.addColorStop(0, `rgba(55, 38, 12, ${a3 * 0.3})`);
    bg3.addColorStop(1, 'rgba(10, 10, 10, 0)');
    ctx.fillStyle = bg3;
    ctx.fillRect(0, 0, W, H);

    const EAs = [
      { name: 'EA Budak Ubat', icon: '👑', color: GOLD },
      { name: 'GoldMind AI', icon: '🧠', color: '#F0D060' },
      { name: 'MathEdge Pro', icon: '📐', color: BRONZE },
      { name: 'Aligator Gozaimasu', icon: '🐊', color: '#8BC34A' },
      { name: 'Encik Moku', icon: '🍄', color: '#FF9500' },
      { name: 'BracketBlitz', icon: '⚡', color: '#00BCD4' },
    ];

    const centerX = W/2, centerY = H/2 - 10;
    const orbitRx = 410, orbitRy = 150;

    EAs.forEach((ea, i) => {
      const spawnTime = 12400 + i * 450;
      if (t < spawnTime) return;

      const coinAge = t - spawnTime;
      const enterP = ease.outBack(clamp(coinAge / 750));
      const orbitAngle = ((t - 12000) / 7500) * Math.PI * 2 + (i / 6) * Math.PI * 2;

      const mx = centerX + Math.cos(orbitAngle) * orbitRx * enterP;
      const my = centerY + Math.sin(orbitAngle) * orbitRy * enterP;
      const spinRot = orbitAngle * 2.2;

      const z = Math.sin(orbitAngle);
      const coinSize = lerp(44, 66, (z + 1) / 2);
      const coinAlpha = lerp(0.55, 1, (z + 1) / 2) * a3 * enterP;

      drawMedallion(mx, my, coinSize, spinRot, coinAlpha, ea.name, ea.icon, ea.color);
    });

    if (t >= 15200) {
      const ctAlpha = ease.out(progress(t, 15200, 600)) * a3;
      ctx.save();
      ctx.font = `bold 40px 'Georgia', serif`;
      ctx.fillStyle = `rgba(245, 240, 232, ${ctAlpha})`;
      ctx.textAlign = 'center';
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 18;
      ctx.fillText('6 Elite Quantitative Systems. One Unified Arsenal.', W/2, H/2 + 245);

      ctx.font = `600 20px 'Segoe UI', sans-serif`;
      ctx.fillStyle = `rgba(212, 175, 55, ${ctAlpha * 0.9})`;
      ctx.letterSpacing = '0.15em';
      ctx.fillText('GOLD (XAUUSD) · INDICES (US30/NAS100) · FOREX MAJORS', W/2, H/2 + 288);
      ctx.restore();
    }
  }

  // Transition wipe 3→4
  if (t >= 17500 && t < 18500) {
    drawLiquidWipe(progress(t, 17500, 1000));
  }

  // ═══════════════════════════════════════════
  // ACT 4: THE GIFT (18000 – 24000ms)
  // ═══════════════════════════════════════════
  if (t >= 18000 && t < 25000) {
    const act4Enter = ease.out(progress(t, 18000, 600));
    const act4Exit = t < 24000 ? 1 : 1 - progress(t, 24000, 1000);
    const a4 = act4Enter * act4Exit;

    const burstP = progress(t, 18400, 2000);
    if (burstP > 0) {
      const bg4 = ctx.createRadialGradient(W/2, H/2, 0, W/2, H/2, 540 * ease.out(burstP));
      bg4.addColorStop(0, `rgba(240, 208, 96, ${0.18 * a4 * ease.out(burstP)})`);
      bg4.addColorStop(0.5, `rgba(212, 175, 55, ${0.1 * a4})`);
      bg4.addColorStop(1, 'rgba(10, 10, 10, 0)');
      ctx.fillStyle = bg4;
      ctx.fillRect(0, 0, W, H);
    }

    // Gift Box Unboxing Visual
    if (t >= 18000 && t < 20200) {
      const boxP = ease.outBack(progress(t, 18000, 800));
      const boxSize = 120 * boxP;
      const bx = W/2, by = H/2 - 20;

      ctx.save();
      ctx.globalAlpha = a4 * (t < 19600 ? 1 : 1 - progress(t, 19600, 500));

      ctx.fillStyle = linearGold(bx-boxSize, by-boxSize, bx+boxSize, by+boxSize);
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 35;
      ctx.fillRect(bx - boxSize, by - boxSize*0.3, boxSize*2, boxSize*1.3);

      const lidAngle = t >= 18800 ? -ease.out(progress(t, 18800, 500)) * 0.85 : 0;
      ctx.save();
      ctx.translate(bx - boxSize, by - boxSize*0.3);
      ctx.rotate(lidAngle);
      ctx.fillStyle = '#B8941E';
      ctx.fillRect(0, -boxSize*0.35, boxSize*2, boxSize*0.35);

      ctx.fillStyle = AMBER;
      ctx.fillRect(boxSize - boxSize*0.08, -boxSize*0.35, boxSize*0.16, boxSize*0.35);
      ctx.restore();

      ctx.fillStyle = AMBER;
      ctx.fillRect(bx - boxSize*0.08, by - boxSize*0.3, boxSize*0.16, boxSize*1.3);

      ctx.restore();
    }

    // Price transformation: $149 USD Strikethrough → $0 FREE LIFETIME
    if (t >= 19500) {
      const priceP = progress(t, 19500, 2200);

      if (priceP < 0.55) {
        const oldAlpha = a4 * (priceP < 0.35 ? ease.out(priceP / 0.35) : 1 - ease.in((priceP - 0.35) / 0.2));
        ctx.save();
        ctx.font = `bold 76px 'Georgia', serif`;
        ctx.fillStyle = `rgba(180, 150, 100, ${oldAlpha})`;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$149 USD', W/2, H/2 - 30);

        if (priceP > 0.18) {
          const lineP = clamp((priceP - 0.18) / 0.2);
          const textW = ctx.measureText('$149 USD').width;
          ctx.strokeStyle = `rgba(255, 60, 60, ${oldAlpha})`;
          ctx.lineWidth = 5;
          ctx.beginPath();
          ctx.moveTo(W/2 - textW/2 - 10, H/2 - 30);
          ctx.lineTo(W/2 - textW/2 - 10 + (textW + 20) * ease.out(lineP), H/2 - 30);
          ctx.stroke();
        }
        ctx.restore();
      }

      // "$0 FREE" triumphant reveal
      if (priceP > 0.32) {
        const freeAlpha = ease.outElastic(clamp((priceP - 0.32) / 0.45)) * a4;
        const freeScale = ease.outElastic(clamp((priceP - 0.32) / 0.5));
        ctx.save();
        ctx.translate(W/2, H/2 - 20);
        ctx.scale(freeScale, freeScale);
        ctx.font = `900 110px 'Georgia', serif`;
        ctx.fillStyle = linearGold(-180, -55, 180, 55, freeAlpha);
        ctx.shadowColor = GOLD;
        ctx.shadowBlur = 45;
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('$0 FREE', 0, 0);
        ctx.restore();

        if (priceP > 0.55) {
          const subAlpha = ease.out((priceP - 0.55) / 0.3) * a4;
          ctx.save();
          ctx.font = `700 30px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(245, 240, 232, ${subAlpha * 0.95})`;
          ctx.textAlign = 'center';
          ctx.shadowColor = GOLD;
          ctx.shadowBlur = 15;
          ctx.fillText('100% Free Lifetime Whitelist via Regulated Partner Brokers', W/2, H/2 + 80);

          ctx.font = `400 20px 'Segoe UI', sans-serif`;
          ctx.fillStyle = `rgba(212, 175, 55, ${subAlpha * 0.85})`;
          ctx.fillText('Tickmill · RoboForex · XM · FBS · JustMarkets · Headway · Eightcap', W/2, H/2 + 125);
          ctx.restore();
        }
      }
    }
  }

  // Transition wipe 4→5
  if (t >= 23500 && t < 24500) {
    drawLiquidWipe(progress(t, 23500, 1000), 'left');
  }

  // ═══════════════════════════════════════════
  // ACT 5: THE CALL (24000 – 30000ms)
  // ═══════════════════════════════════════════
  if (t >= 24000) {
    const act5Enter = ease.out(progress(t, 24000, 800));
    const a5 = act5Enter * (t < 29000 ? 1 : 1 - progress(t, 29000, 1000));

    const bg5 = ctx.createRadialGradient(W/2, H*0.42, 0, W/2, H*0.42, 550);
    bg5.addColorStop(0, `rgba(55, 42, 15, ${a5 * 0.35})`);
    bg5.addColorStop(1, 'rgba(10, 10, 10, 0)');
    ctx.fillStyle = bg5;
    ctx.fillRect(0, 0, W, H);

    // Crown logo centered
    const crownP5 = ease.outElastic(clamp(progress(t, 24150, 1200)));
    drawCrown(W/2, H/2 - 110, 110 * crownP5, Math.sin(t/2500)*0.025, a5 * crownP5, Math.sin(t/350)*0.5+0.5);

    // Brand name
    if (t >= 24700) {
      const brandAlpha = ease.out(progress(t, 24700, 600)) * a5;
      ctx.save();
      ctx.font = `900 56px 'Georgia', serif`;
      ctx.fillStyle = linearGold(W/2-240, H/2+15, W/2+240, H/2+45, brandAlpha);
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 20;
      ctx.textAlign = 'center';
      ctx.fillText('EA BUDAK UBAT', W/2, H/2 + 25);
      ctx.restore();
    }

    // Official Domain Link (RULE: Always eabudakubat.com)
    if (t >= 25400) {
      const urlAlpha = ease.out(progress(t, 25400, 500)) * a5;
      ctx.save();
      ctx.font = `bold 34px 'Segoe UI', sans-serif`;
      ctx.fillStyle = `rgba(240, 208, 96, ${urlAlpha})`;
      ctx.textAlign = 'center';
      ctx.shadowColor = GOLD;
      ctx.shadowBlur = 15;
      ctx.fillText('https://eabudakubat.com', W/2, H/2 + 85);
      ctx.restore();
    }

    // Secondary CTA
    if (t >= 26100) {
      const ctaAlpha = ease.out(progress(t, 26100, 600)) * a5;
      ctx.save();
      ctx.font = `300 24px 'Segoe UI', sans-serif`;
      ctx.fillStyle = `rgba(245, 240, 232, ${ctaAlpha * 0.9})`;
      ctx.textAlign = 'center';
      ctx.fillText('Unlock Unrestricted Algorithmic Power at Zero Cost', W/2, H/2 + 138);
      ctx.restore();
    }

    // 3-Step Setup Micro Badges
    if (t >= 26800) {
      const stepAlpha = ease.out(progress(t, 26800, 600)) * a5;
      const steps = ['1. Choose Partner Broker', '2. Verify Whitelist Instant', '3. Download & Deploy'];
      ctx.save();
      ctx.font = `bold 19px 'Segoe UI', sans-serif`;
      ctx.textAlign = 'center';
      steps.forEach((step, i) => {
        const sDelay = i * 220;
        const sAlpha = ease.out(progress(t, 27000 + sDelay, 400)) * stepAlpha;
        const sx = W/2 - 280 + i * 280;
        ctx.fillStyle = `rgba(212, 175, 55, ${sAlpha})`;
        ctx.fillText(step, sx, H/2 + 195);
      });
      ctx.restore();
    }

    // Golden subtle separator lines
    if (t >= 24900) {
      const lineAlpha = ease.out(progress(t, 24900, 800)) * a5 * 0.4;
      const lineW = 340 * ease.out(progress(t, 24900, 800));
      ctx.save();
      ctx.strokeStyle = `rgba(212, 175, 55, ${lineAlpha})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(W/2 - lineW, H/2 + 50);
      ctx.lineTo(W/2 + lineW, H/2 + 50);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ═══════════════════════════════════════════
  // VIGNETTE OVERLAY
  // ═══════════════════════════════════════════
  const vig = ctx.createRadialGradient(W/2, H/2, H*0.35, W/2, H/2, H*0.85);
  vig.addColorStop(0, 'rgba(0,0,0,0)');
  vig.addColorStop(1, 'rgba(0,0,0,0.65)');
  ctx.fillStyle = vig;
  ctx.fillRect(0, 0, W, H);
}

// Expose render on window for headless renderers
window.render = render;

// ─── PLAYBACK ENGINE (Interactive Canvas) ───
let isPlaying = false;
let currentTime = 0;
let lastFrameTime = null;
let audioCtx = null;
let audioBuffer = null;
let audioSource = null;
let isMuted = false;

function tick(timestamp) {
  if (!lastFrameTime) lastFrameTime = timestamp;
  if (isPlaying) {
    const delta = timestamp - lastFrameTime;
    currentTime += delta;
    if (currentTime >= DURATION) {
      currentTime = DURATION;
      isPlaying = false;
      document.getElementById('btn-play').textContent = '▶ Play';
    }
    render(currentTime);
    document.getElementById('timeline').value = currentTime;
    updateTimeDisplay();
  }
  lastFrameTime = timestamp;
  requestAnimationFrame(tick);
}

function updateTimeDisplay() {
  const s = currentTime / 1000;
  const m = Math.floor(s / 60);
  const sec = (s % 60).toFixed(1);
  document.getElementById('time-display').textContent = `${m}:${sec.padStart(4, '0')}`;
}

function togglePlay() {
  if (currentTime >= DURATION) currentTime = 0;
  isPlaying = !isPlaying;
  document.getElementById('btn-play').textContent = isPlaying ? '⏸ Pause' : '▶ Play';
  if (isPlaying) startAudio();
  else stopAudio();
}

function restart() {
  currentTime = 0;
  isPlaying = true;
  document.getElementById('btn-play').textContent = '⏸ Pause';
  lastFrameTime = null;
  render(0);
  stopAudio();
  startAudio();
}

async function loadAudio() {
  try {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const resp = await fetch('soundtrack_v2.wav');
    if (!resp.ok) { console.warn('No audio file found'); return; }
    const buf = await resp.arrayBuffer();
    audioBuffer = await audioCtx.decodeAudioData(buf);
  } catch(e) { console.warn('Audio load error:', e); }
}

function startAudio() {
  if (!audioBuffer || !audioCtx || isMuted) return;
  stopAudio();
  audioSource = audioCtx.createBufferSource();
  audioSource.buffer = audioBuffer;
  audioSource.connect(audioCtx.destination);
  audioSource.start(0, currentTime / 1000);
}

function stopAudio() {
  if (audioSource) { try { audioSource.stop(); } catch(e){} audioSource = null; }
}

// ─── UI CONTROLS ───
document.getElementById('btn-play').addEventListener('click', togglePlay);
document.getElementById('btn-restart').addEventListener('click', restart);

document.getElementById('timeline').addEventListener('input', (e) => {
  const wasPlaying = isPlaying;
  if (wasPlaying) { isPlaying = false; stopAudio(); }
  currentTime = parseInt(e.target.value);
  render(currentTime);
  updateTimeDisplay();
  if (wasPlaying) { isPlaying = true; startAudio(); }
});

document.querySelectorAll('.act-pill').forEach(pill => {
  pill.addEventListener('click', () => {
    const targetT = parseInt(pill.dataset.t);
    currentTime = targetT;
    render(currentTime);
    document.getElementById('timeline').value = currentTime;
    updateTimeDisplay();
    stopAudio();
    if (isPlaying) startAudio();
  });
});

document.getElementById('btn-mute').addEventListener('click', () => {
  isMuted = !isMuted;
  document.getElementById('btn-mute').textContent = isMuted ? '🔇' : '🔊';
  if (isMuted) stopAudio();
  else if (isPlaying) startAudio();
});

document.getElementById('btn-fs').addEventListener('click', () => {
  if (!document.fullscreenElement) C.requestFullscreen();
  else document.exitFullscreen();
});

function updateActPills() {
  const pills = document.querySelectorAll('.act-pill');
  const actTimes = [0, 6000, 12000, 18000, 24000];
  let activeIdx = 0;
  for (let i = actTimes.length - 1; i >= 0; i--) {
    if (currentTime >= actTimes[i]) { activeIdx = i; break; }
  }
  pills.forEach((p, i) => p.classList.toggle('active', i === activeIdx));
}
setInterval(updateActPills, 200);

// Initial render
render(0);
loadAudio();
requestAnimationFrame(tick);
</script>
